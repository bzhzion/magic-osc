# CI de poussee : build Rust + tests sur les trois OS principaux.
# Le build Linux arm64 (Raspberry Pi) n'est teste qu'au moment du release
# (cross-compile par Qemu, lent) : le valider a chaque push ralentirait tout
# le monde sans gain, les divergences arm64 etant extremement rares pour une
# app qui tient en MIDI + OSC + Tauri.
#
# Depot public : runners GitHub gratuits.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  construire:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: linux, runner: ubuntu-latest }
          - { nom: windows, runner: windows-latest }
          - { nom: macos, runner: macos-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer les dependances systeme Tauri (Linux)
        if: matrix.nom == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer dependances Node
        run: npm ci --no-audit --no-fund

      - name: Construire le frontend
        run: npm run build

      - name: Verifier le code Rust (cargo check)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --locked
